# Change these first
owner: Kivot-OS # Your GitHub organization or username, where this repository lives
repo: KivotOS-status # The name of this repository

sites:
  - name: KivotOS APT Repository
    url: https://kivot-os.github.io/KivotOS-repo/dists/trixie/InRelease
    expectedStatusCodes: [200]

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  #  cname: demo.upptime.js.org
  baseUrl: /KivotOS-status
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: KivotOS Status
  introTitle: "Trạng thái hệ thống **KivotOS Repository**."
  introMessage: Đây là trang theo dõi trạng thái hoạt động và độ trễ của kho lưu trữ phần mềm KivotOS. Dữ liệu được cập nhật liên tục thông qua GitHub Actions để đảm bảo tính sẵn sàng cao nhất cho người dùng.
  customHeadHtml: |
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  customBodyHtml: |
    <div id="repo-branding" style="background: rgba(17, 17, 27, 0.8); backdrop-filter: blur(8px); border-bottom: 1px solid #313244; padding: 0.75rem 0; sticky; top: 0; z-index: 100;">
      <div class="container" style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 24px; height: 24px; background: linear-gradient(135deg, #89b4fa, #cba6f7); border-radius: 6px;"></div>
          <span style="font-weight: 700; color: #89b4fa; font-size: 1.1rem; letter-spacing: -0.02em;">Kivot-OS</span>
        </div>
        <div style="font-size: 0.8rem; color: #a6adc8; font-weight: 500;">LIVE MONITORING</div>
      </div>
    </div>
  customFootHtml: |
    <div style="text-align: center; padding: 2rem 0; color: #6c7086; font-size: 0.85rem;">
      <p>Hệ thống giám sát tự động bởi GitHub Actions</p>
      <div style="display: flex; justify-content: center; gap: 15px; margin-top: 10px;">
        <a href="https://github.com/Kivot-OS" style="color: #9399b2; text-decoration: none;">GitHub</a>
        <a href="https://kivot-os.github.io/KivotOS-repo/" style="color: #9399b2; text-decoration: none;">Repository</a>
      </div>
    </div>
  js: |
    console.log("%c Kivot-OS %c System Operational ", "background:#89b4fa; color:#11111b; padding:2px 5px; border-radius:3px 0 0 3px; font-weight:bold;", "background:#313244; color:#cdd6f4; padding:2px 5px; border-radius:0 3px 3px 0;");
    window.addEventListener('scroll', () => {
      const header = document.getElementById('repo-branding');
      if (window.scrollY > 20) {
        header.style.boxShadow = '0 10px 30px rgba(0,0,0,0.3)';
      } else {
        header.style.boxShadow = 'none';
      }
    });
  theme: night
  themeUrl: https://kivot-os.github.io/KivotOS-status/kivotos-theme.css
  navbar:
    - title: Trang chủ
      href: https://kivot-os.github.io/KivotOS-repo/
    - title: Trạng thái
      href: /KivotOS-status
    - title: GitHub
      href: https://github.com/Kivot-OS/KivotOS-repo
  footer: "Duy trì bởi **Kivot-OS Team**"

i18n:
  activeIncidents: Sự cố đang diễn ra
  allSystemsOperational: Tất cả hệ thống hoạt động bình thường
  incidentReport: Báo cáo sự cố
  pastIncidents: Sự cố trong quá khứ
  overallUptime: Uptime tổng thể
  overallUptimeRenewed: Uptime tổng thể (đã cập nhật)
  averageResponseTime: Độ trễ trung bình
  averageResponseTimeUnit: ms
  responseTimeGraphAlt: Biểu đồ thời gian phản hồi
  liveStatus: Trạng thái thực tế
  allSystemsOperationalSymbol: "🟩"
  up: Hoạt động
  down: Ngừng hoạt động
  degraded: Hiệu năng giảm
  loading: Đang tải...
  navStatus: Trạng thái
  navHistory: Lịch sử
  navGitHub: GitHub
  footerCopyright: "Bản quyền © $YEAR **Kivot-OS**"
